[project]
name = "guarded-agent"
version = "0.1.0"
description = "FastAPI service serving a deepagents conversational agent behind guardrails"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.21",
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
