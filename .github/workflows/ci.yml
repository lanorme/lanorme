name: CI

# Runs the project gates on every pull request and on pushes to main: the same
# set as scripts/check.sh (agent-copy sync, generated docs, ruff, unit tests,
# eval audit, dogfood lint, package build), so a green check.sh means a green PR.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Agent artifacts in sync
        run: scripts/sync-agents.sh --check

      - name: Generated docs in sync
        run: uv run python scripts/gen_docs.py --check

      - name: Ruff (trailing commas, formatting)
        run: |
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .

      - name: Unit tests
        run: uv run --group dev pytest tests/unit

      - name: Eval audit (corpora complete, holdout not below the last release)
        run: uv run python evals/audit.py --version check --no-perf --output "$(mktemp)" --gate latest

      - name: Lint (lanorme dogfood)
        run: uv run lanorme check .

      - name: Build
        run: uv build
